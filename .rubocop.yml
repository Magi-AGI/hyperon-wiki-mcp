inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'bin/**/*'
    - 'sig/**/*'

# String literal style
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Documentation requirements
Style/Documentation:
  Enabled: false  # We have inline docs in key places, not every class

# Metrics - reasonable limits
# NOTE: inherit_mode merge keeps the .rubocop_todo.yml debt-ledger Exclude entries
# instead of having these child Exclude lists replace them wholesale.
Metrics/MethodLength:
  inherit_mode:
    merge:
      - Exclude
  Max: 25
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Max: 25
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 250

Metrics/AbcSize:
  inherit_mode:
    merge:
      - Exclude
  Max: 20
  # lib/hyperon/wiki/mcp/auth.rb carries an inline `# rubocop:enable Metrics/AbcSize`,
  # which re-enables this cop for that file even though .rubocop_todo.yml excludes it.
  # Allowing the single offending method is narrower than raising Max globally.
  AllowedMethods:
    - fetch_jwks
  Exclude:
    - 'spec/**/*'

# Layout preferences
Layout/LineLength:
  inherit_mode:
    merge:
      - Exclude
  Max: 120
  Exclude:
    - 'spec/**/*'

# Allow compact module/class definitions
Style/ClassAndModuleChildren:
  Enabled: false

# Allow both single and double quotes for consistency
Style/QuotedSymbols:
  Enabled: false

# Prefer modern Hash syntax
Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys

# Numeric literals
Style/NumericLiterals:
  MinDigits: 6  # Only for very large numbers

# Frozen string literal required
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Allow short parameter names 'q' for query parameters and 'to' for format conversion
Naming/MethodParameterName:
  AllowedNames:
    - q
    - to
